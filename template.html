const MS = 86400000;

const dow0 = new Date(startMs).getUTCDay();
function dIdx(s){ const p = s.split('-').map(Number); return Math.round((Date.UTC(p[0], p[1]-1, p[2]) - startMs)/MS); }
function idxDate(i){ return new Date(startMs + i*MS); }
function monthStartIdx(y, m){ return Math.round((Date.UTC(y, m, 1) - startMs)/MS); }

const N = DATA.primary.ALL.length, LAST = N-1;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtInt = n => Math.round(n).toLocaleString('en-US');

try { const s = JSON.parse(localStorage.getItem('arxiv-math-pulse') || 'null'); if (s && s.sel && s.slots) state = Object.assign({}, DEFAULT, s); } catch (e) {}

  const avg = (cat, y) => sumRange(state.mode, cat, monthStartIdx(y, 0), Math.min(monthStartIdx(y, 12), lastFullMonthEnd)) / nMonths(y);
  const rows = ['ALL'].concat(CATS).map(cat => { const r = {cat}; years.forEach(y => r['y' + y] = avg(cat, y)); const l = r['y' + lastY]; r.d22 = r.y2022 > 0 ? (l / r.y2022 - 1) * 100 : NaN; r.d24 = r.y2024 > 0 ? (l / r.y2024 - 1) * 100 : NaN; return r; });
  const key = state.sort in rows[0] ? state.sort : 'y' + lastY; const head = rows.shift(); rows.sort((a, b) => (Number.isNaN(b[key]) ? -Infinity : b[key]) - (Number.isNaN(a[key]) ? -Infinity : a[key])); rows.unshift(head);
  const t = hel('table'); const th = hel('thead'); const tr = hel('tr'); tr.appendChild(hel('th', null, 'Subject'));
  const cols = years.map(y => ({k: 'y' + y, label: y === lastY ? y + ' (Jan–' + MON[lastM] + ')' : String(y)})).concat([{k: 'd22', label: 'Change vs 2022'}, {k: 'd24', label: 'Change vs 2024'}]);
  cols.forEach(c => { const h = hel('th', 'sortable' + (c.k === key ? ' sorted' : ''), c.label); h.tabIndex = 0; h.setAttribute('role', 'button'); h.setAttribute('aria-sort', c.k === key ? 'descending' : 'none'); const go = () => { state.sort = c.k; save(); renderSummary(); }; h.addEventListener('click', go); h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); tr.appendChild(h); }); th.appendChild(tr); t.appendChild(th);
  const tb = hel('tbody'); rows.forEach(r => { const row = hel('tr', r.cat === 'ALL' ? 'all' : null); const c0 = hel('td', null, labelOf(r.cat)); if (r.cat !== 'ALL') c0.appendChild(hel('span', 'nm', NAMES[r.cat])); row.appendChild(c0);
    years.forEach(y => row.appendChild(hel('td', null, fmtInt(r['y' + y])))); ['d22', 'd24'].forEach(k => { const v = r[k]; const td = hel('td', v < 0 ? 'neg' : null, Number.isNaN(v) ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(0) + '%'); row.appendChild(td); }); tb.appendChild(row); }); t.appendChild(tb); wrap.appendChild(t); }

// ---------- controls ----------
function syncControls(){ document.querySelectorAll('.seg').forEach(seg => { const key = seg.dataset.key; seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(state[key]) === b.dataset.v ? 'true' : 'false')); });
  document.getElementById('context').checked = !!state.context; }
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; state[seg.dataset.key] = b.dataset.v; save(); renderAll(); }));
document.getElementById('context').addEventListener('change', ev => { state.context = ev.target.checked; save(); renderAll(); });

function renderAll(){ syncControls(); renderMeta(); renderLegend(); renderPicker(); renderMain(); renderMultiples(); renderSummary(); }
// ---------- hero: the title types itself out (skipped under prefers-reduced-motion) ----------
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const q = document.querySelector('.q'), cursor = q.querySelector('.cursor'), l3 = q.querySelector('.l3');
  const chars = [];
  q.querySelectorAll('.l1,.l2,.l3').forEach(l => {
    const walker = document.createTreeWalker(l, NodeFilter.SHOW_TEXT); const nodes = []; let n; while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(tn => { const frag = document.createDocumentFragment(); for (const c of tn.nodeValue) { const s = hel('span', 'ch', c); frag.appendChild(s); chars.push(s); } tn.parentNode.replaceChild(frag, tn); });
  });
  let i = 0;
  (function step(){
    if (i >= chars.length) { l3.appendChild(cursor); return; }
    const s = chars[i++]; s.style.visibility = 'visible';
    s.after(cursor); // the cursor rides along right behind the last typed character
    setTimeout(step, s.textContent === ' ' ? 90 : 45);
  })();
})();

// ---------- hero: the "last updated" line (count follows the primary / any setting) ----------
function renderMeta(){
  const g = DATA.generated.split('-').map(Number);
  const m = document.getElementById('meta'); m.textContent = 'Last updated ' + fmtDate(new Date(Date.UTC(g[0], g[1]-1, g[2]))) + ' · ';
  m.appendChild(hel('b', null, fmtInt(state.mode === 'any' ? DATA.nAny : DATA.nPrimary)));
  m.appendChild(document.createTextNode(' math papers since ' + fmtDate(idxDate(0)) + (state.mode === 'any' ? ', counting cross-lists' : '')));
}
// ---------- settings popover ----------
(function(){
  const gear = document.getElementById('gear'), panel = document.getElementById('settings-panel');
  const open = v => { panel.hidden = !v; gear.setAttribute('aria-expanded', String(v)); if (v) { const b = panel.querySelector('button[aria-pressed="true"]') || panel.querySelector('button'); b && b.focus(); } };
  gear.addEventListener('click', () => open(panel.hidden));
  document.addEventListener('click', ev => { if (!panel.hidden && !ev.target.closest('.settings')) open(false); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !panel.hidden) { open(false); gear.focus(); } });
})();
let raf = 0; let lastW = 0;
new ResizeObserver(() => { const w = mainWrap.clientWidth; if (Math.abs(w - lastW) < 4) return; lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { renderMain(); renderMultiples(); }); }).observe(mainWrap);
document.getElementById('multView').addEventListener('toggle', ev => { if (ev.target.open) renderMultiples(); });
document.fonts && document.fonts.ready.then(() => renderAll());
renderAll();
})();
</script>
